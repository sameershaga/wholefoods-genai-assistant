  <body>
    <article>
      <h1>Oat Milk Overnight Oats</h1>
      <section>
        <h2>Ingredients</h2>
        <ul>
          <li>1 cup rolled oats</li>
          <li>1 cup oat milk</li>
          <li>1 tablespoon chia seeds</li>
        </ul>
      </section>
      <section>
        <h2>Preparation</h2>
        <ol>
          <li>Combine all ingredients in a covered container.</li>
          <li>Refrigerate overnight and serve chilled.</li>
        </ol>
      </section>
    </article>
